[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Route API requests to the Netlify Function before the SPA fallback.
[[redirects]]
  from = "/api/supabase-mgmt"
  to = "/.netlify/functions/supabase-mgmt"
  status = 200
  force = true

[[redirects]]
  from = "/api/auto-resume"
  to = "/.netlify/functions/auto-resume-now"
  status = 200
  force = true

# Single-page app: every remaining path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
